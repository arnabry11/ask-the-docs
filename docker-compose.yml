services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ask}:${POSTGRES_PASSWORD:-ask}@db:5432/${POSTGRES_DB:-ask_the_docs}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      INGEST_ADMIN_KEY: ${INGEST_ADMIN_KEY:-}
      TOP_K_VECTOR: ${TOP_K_VECTOR:-30}
      TOP_K_FTS: ${TOP_K_FTS:-30}
      RRF_K: ${RRF_K:-60}
      RERANK_MODEL: ${RERANK_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
      RERANK_TOP_N: ${RERANK_TOP_N:-20}
      GATE_THRESHOLD: ${GATE_THRESHOLD:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CONTEXT_CHUNKS: ${CONTEXT_CHUNKS:-4}
      CONTEXT_TOKENS_PER_CHUNK: ${CONTEXT_TOKENS_PER_CHUNK:-300}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-512}
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/app/models
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["rq", "worker", "ingestion", "--url", "redis://redis:6379/0", "--with-scheduler", "--worker-class", "rq.worker.SpawnWorker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ask}:${POSTGRES_PASSWORD:-ask}@db:5432/${POSTGRES_DB:-ask_the_docs}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    volumes:
      - model_cache:/app/models
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    command: ["--no-dump-schema", "migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ask}:${POSTGRES_PASSWORD:-ask}@db:5432/${POSTGRES_DB:-ask_the_docs}?sslmode=disable
    volumes:
      - ./db/migrations:/db/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.6-pg16-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ask}
      POSTGRES_DB: ${POSTGRES_DB:-ask_the_docs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  model_cache:
