name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-trixie
        env:
          POSTGRES_USER: ask
          POSTGRES_PASSWORD: ask
          POSTGRES_DB: ask_the_docs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ask -d ask_the_docs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ask:ask@localhost:5432/ask_the_docs?sslmode=disable
      RUN_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app evals
      - name: Install dbmate
        run: |
          curl -fsSLo "$RUNNER_TEMP/dbmate" https://github.com/amacneil/dbmate/releases/download/v2.36.0/dbmate-linux-amd64
          chmod +x "$RUNNER_TEMP/dbmate"
      - run: "$RUNNER_TEMP/dbmate --no-dump-schema migrate"
      - run: uv run pytest -q
      - run: docker build -t ask-the-docs:test .

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up --build -d
      - name: Check migrated app startup
        run: curl --fail --retry 20 --retry-all-errors --retry-delay 2 --silent --show-error http://127.0.0.1:8000/health
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
