[project]
name = "ask-the-docs"
version = "0.1.0"
description = "A measured, cost-aware RAG service for public technical documentation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "fastembed>=0.8,<1",
    "httpx>=0.27,<1",
    "markdown-it-py>=3,<5",
    "pgvector>=0.5,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.0,<3",
    "sqlalchemy>=2.0,<3",
    "tiktoken>=0.9,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires PostgreSQL with pgvector"]
